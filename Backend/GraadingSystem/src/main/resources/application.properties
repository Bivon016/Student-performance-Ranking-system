spring.application.name=GraadingSystem
# Change from 'none' to 'update' temporarily
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/SCHOOLMANAGEMENTSYSTEM
spring.datasource.username=root
spring.datasource.password=Bivon@016
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Keep the naming strategy uncommented
