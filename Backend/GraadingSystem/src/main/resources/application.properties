spring.application.name=GraadingSystem
# Change from 'none' to 'update' temporarily
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/grading_system
spring.datasource.username=root
spring.datasource.password=556041
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Keep the naming strategy uncommented
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Optional debugging
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=Faith
spring.security.user.password=12345